<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2340" />
<title>Companion</title>
<style>
  :root {
    --ink: #1b2340;
    --panel: #232c52;
    --bubble-ai: #2e386b;
    --bubble-me: #f08aa6;
    --text: #f1eef8;
    --text-me: #2a1020;
    --muted: #9aa3cf;
    --glow: #8fa2ff;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
  }
  #avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd3e0, #f08aa6 45%, #7b5cff 100%);
    box-shadow: 0 0 0 0 rgba(143, 162, 255, .5);
    flex: none;
    margin-right: 4px;
  }
  #avatar.thinking { animation: breathe 1.6s ease-in-out infinite; }
  #avatar.speaking { animation: talk .7s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(143, 162, 255, .45); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(143, 162, 255, 0); }
  }
  @keyframes talk {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 138, 166, .5); }
    50% { transform: scale(1.14); box-shadow: 0 0 0 12px rgba(240, 138, 166, 0); }
  }
  .title { flex: 1; min-width: 0; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hbtn {
    border: 0;
    background: var(--ink);
    color: var(--text);
    border-radius: 18px;
    height: 36px;
    min-width: 36px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: none;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--text-me); border-bottom-right-radius: 6px; }
  .msg.typing { color: var(--muted); }

  form.bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    align-items: center;
  }
  #mic {
    flex: none;
    width: 44px; height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #mic.on { background: var(--bubble-me); color: var(--text-me); animation: talk .9s ease-in-out infinite; }
  #input, #memInput {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 22px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--text);
    font: inherit;
  }
  #input::placeholder, #memInput::placeholder { color: var(--muted); }
  #send, #memAdd {
    border: 0;
    border-radius: 22px;
    height: 44px;
    padding: 0 20px;
    background: var(--bubble-me);
    color: var(--text-me);
    font: inherit;
    font-weight: 600;
  }
  #send:disabled { opacity: .5; }
  #input:focus-visible, #memInput:focus-visible, #send:focus-visible, #memAdd:focus-visible,
  #mic:focus-visible, .hbtn:focus-visible, .del:focus-visible, #memClear:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

  /* Memories panel */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel[hidden] { display: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--panel);
  }
  .panel-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  #memList {
    list-style: none;
    margin: 0;
    padding: 12px 16px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #memList li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--bubble-ai);
    border-radius: 14px;
    padding: 10px 6px 10px 14px;
  }
  #memList li span { flex: 1; overflow-wrap: anywhere; }
  #memList li.empty { background: transparent; color: var(--muted); padding: 8px 0; }
  .del {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex: none;
  }
  #memClear {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 12px;
  }

  #stage {
    position: relative;
    flex: none;
    height: min(27vh, 196px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(143, 162, 255, .16), transparent 62%), var(--ink);
  }
  #stage[hidden] { display: none; }
  #face { height: 100%; width: auto; max-width: 100%; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .stagebtn { position: absolute; top: 8px; height: 32px; font-size: 13px; padding: 0 12px; background: rgba(35, 44, 82, .9); }
  #lookBtn { left: 12px; }
  #stageHide { right: 12px; }
  body.stage-on #avatar { display: none; }
  #avatar { cursor: pointer; }
  #stage3d { position: absolute; inset: 0; }
  #stage3d[hidden] { display: none; }
  #stage3d canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  header .hbtn { padding: 0 10px; }
  #credit { position: absolute; left: 12px; top: 10px; max-width: 150px; font-size: 11px; line-height: 1.25; color: var(--muted); pointer-events: none; }
  #credit[hidden] { display: none; }
  body.mode-3d #stage { height: min(32vh, 250px); }
  /* Full-screen view: the avatar fills the screen and the chat floats over her */
  body.view-full #stage {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--fullH, 100%);
    z-index: 0;
    background: radial-gradient(circle at 50% 36%, #3b4285 0%, #232a56 48%, #131833 100%);
  }
  body.view-full header { position: relative; z-index: 2; background: transparent; }
  body.view-full .title h1 { display: none; }
  body.view-full #status { color: #e3e7ff; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
  body.view-full .hbtn { background: rgba(27, 35, 64, .62); }
  body.view-full .stagebtn { display: none; }
  body.view-full #credit { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 66px); left: 14px; z-index: 1; }
  body.view-full main {
    position: relative; z-index: 2;
    flex: 0 1 auto; margin-top: auto;
    max-height: min(46vh, 380px);
    padding-top: 28px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
  }
  body.view-full .msg.ai { background: rgba(46, 56, 107, .68); }
  body.view-full .msg.me { background: rgba(240, 138, 166, .8); }
  body.view-full form { position: relative; z-index: 2; background: rgba(27, 35, 64, .5); }
  body.view-full #input, body.view-full #mic { background: rgba(70, 80, 140, .7); }
  @media (max-height: 640px) { body:not(.view-full) #stage { display: none; } body:not(.view-full).stage-on #avatar { display: block; } }

  @media (prefers-reduced-motion: reduce) {
    #avatar.thinking, #avatar.speaking, #mic.on { animation: none; }
    main { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <header>
    <div id="avatar" aria-hidden="true"></div>
    <div class="title">
      <h1 id="name"></h1>
      <div id="status">Online</div>
    </div>
    <button id="viewBtn" class="hbtn" type="button" aria-label="Change the avatar view">Full</button>
    <button id="voiceBtn" class="hbtn" type="button" aria-label="Change voice">Voice</button>
    <button id="memBtn" class="hbtn" type="button" aria-label="Open memories">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span id="memCount">0</span>
    </button>
    <button id="muteBtn" class="hbtn" type="button" aria-label="Mute or unmute her voice"></button>
  </header>

  <div id="stage" hidden>
    <svg id="face" viewBox="0 0 200 220" role="img" aria-label="Your companion. Tap to change her look.">
      <defs>
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="62%">
          <stop id="bgA" offset="0" stop-color="#3a3f7a"/>
          <stop id="bgB" offset="1" stop-color="#1b2340"/>
        </radialGradient>
        <clipPath id="clipRound"><circle cx="100" cy="112" r="98"/></clipPath>
      </defs>
      <circle cx="100" cy="112" r="98" fill="url(#bgGrad)"/>
      <g clip-path="url(#clipRound)">
        <g id="figure">
          <path id="hairBack" d="M44 100 C34 40 68 14 100 14 C132 14 166 40 156 100 C164 152 154 198 146 226 L54 226 C46 198 36 152 44 100 Z"/>
          <path id="outfit" d="M26 226 C30 184 62 166 100 166 C138 166 170 184 174 226 Z"/>
          <rect id="neck" x="88" y="138" width="24" height="34" rx="10"/>
          <g id="head">
            <ellipse id="skin" cx="100" cy="98" rx="50" ry="56"/>
            <path id="hairFront" d="M50 94 C42 48 72 28 100 28 C128 28 158 48 150 94 C142 76 128 62 108 56 C96 72 72 84 50 94 Z"/>
            <circle id="cheekL" cx="68" cy="114" r="9" fill="#ff7a9c" opacity=".3"/>
            <circle id="cheekR" cx="132" cy="114" r="9" fill="#ff7a9c" opacity=".3"/>
            <path id="browL" d="M63 82 Q76 75 89 80" fill="none" stroke-width="3.5" stroke-linecap="round"/>
            <path id="browR" d="M111 80 Q124 75 137 82" fill="none" stroke-width="3.5" stroke-linecap="round"/>
            <g id="eyeL">
              <ellipse cx="76" cy="97" rx="9.5" ry="10.5" fill="#fff"/>
              <circle id="pupilL" cx="76" cy="98" r="6.2" fill="#2a1d2e"/>
              <circle cx="78.6" cy="94.6" r="2.1" fill="#fff"/>
            </g>
            <g id="eyeR">
              <ellipse cx="124" cy="97" rx="9.5" ry="10.5" fill="#fff"/>
              <circle id="pupilR" cx="124" cy="98" r="6.2" fill="#2a1d2e"/>
              <circle cx="126.6" cy="94.6" r="2.1" fill="#fff"/>
            </g>
            <path d="M98 108 Q100 114 103 111" fill="none" stroke="rgba(60,20,30,.28)" stroke-width="2" stroke-linecap="round"/>
            <path id="mouth" fill="#7a2a3c" stroke="#7a2a3c" stroke-width="2" stroke-linejoin="round"/>
          </g>
        </g>
      </g>
    </svg>
    <div id="stage3d" hidden></div>
    <div id="credit" hidden>Avatar “Aura” by Mrhunt394 YT</div>
    <button id="lookBtn" class="hbtn stagebtn" type="button" aria-label="Change her look">Look</button>
    <button id="stageHide" class="hbtn stagebtn" type="button" aria-label="Hide the avatar">Hide</button>
  </div>

  <main id="list" aria-live="polite"></main>

  <form id="form" class="bar" autocomplete="off">
    <button id="mic" type="button" aria-label="Speak">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="input" type="text" placeholder="Message" aria-label="Message" enterkeyhint="send" />
    <button id="send" type="submit">Send</button>
  </form>

  <section id="memPanel" class="panel" role="dialog" aria-modal="true" aria-label="Memories" hidden>
    <div class="panel-head">
      <h2>What I remember</h2>
      <button id="memClose" class="hbtn" type="button">Close</button>
    </div>
    <ul id="memList"></ul>
    <form id="memForm" class="bar" autocomplete="off">
      <input id="memInput" type="text" placeholder="Add something to remember" aria-label="Add a memory" maxlength="200" />
      <button id="memAdd" type="submit">Add</button>
    </form>
    <button id="memClear" type="button">Clear all memories</button>
  </section>

<script type="module">
  import { Capacitor, registerPlugin } from "@capacitor/core";

  // ---------- Settings: change these ----------
  const COMPANION_NAME = "Companion";
  const GREETING = "Hi, I’m here. What’s on your mind?";
  const STORAGE_KEY = "companion_chat_v1";
  const MEMORY_KEY = "companion_memories_v1";
  const MAX_MEMORIES = 100;
  const WORKER_URL = "https://companion-api.anokhasoy8.workers.dev";
  const SPEECH_LANG = "en-IN";   // try "hi-IN" for Hindi, "en-US" for US English
  // --------------------------------------------

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const micBtn = document.getElementById("mic");
  const muteBtn = document.getElementById("muteBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const memBtn = document.getElementById("memBtn");
  const memCount = document.getElementById("memCount");
  const memPanel = document.getElementById("memPanel");
  const memList = document.getElementById("memList");
  const memForm = document.getElementById("memForm");
  const memInput = document.getElementById("memInput");
  const memClose = document.getElementById("memClose");
  const memClear = document.getElementById("memClear");
  const avatar = document.getElementById("avatar");
  const statusEl = document.getElementById("status");
  document.getElementById("name").textContent = COMPANION_NAME;
  window.addEventListener("error", function (ev) { statusEl.textContent = "Error: " + (ev.message || "unknown"); });

  // Native plugins (only exist inside the installed Android app)
  let SR = null;
  let TTS = null;
  try {
    if (Capacitor.isNativePlatform()) {
      SR = registerPlugin("SpeechRecognition");
      TTS = registerPlugin("TextToSpeech");
    }
  } catch (e) { SR = null; TTS = null; }

  let messages = [];
  let memories = [];
  let muted = false;
  let voicePos = 0;
  let voiceIdx = [];
  let listening = false;
  let extracting = false;
  let statusTimer = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function setStatus(text, resetAfterMs) {
    statusEl.textContent = text;
    clearTimeout(statusTimer);
    if (resetAfterMs) statusTimer = setTimeout(function () { statusEl.textContent = "Online"; }, resetAfterMs);
  }

  function load() {
    try { messages = JSON.parse(lsGet(STORAGE_KEY) || "[]"); } catch (e) { messages = []; }
    try { memories = JSON.parse(lsGet(MEMORY_KEY) || "[]"); } catch (e) { memories = []; }
    if (!Array.isArray(messages)) messages = [];
    if (!Array.isArray(memories)) memories = [];
    muted = lsGet("companion_muted") === "1";
    voicePos = parseInt(lsGet("companion_voice") || "0", 10) || 0;
  }
  function save() { lsSet(STORAGE_KEY, JSON.stringify(messages.slice(-200))); }
  function saveMemories() { lsSet(MEMORY_KEY, JSON.stringify(memories)); }

  function bubble(role, text, extraClass) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extraClass ? " " + extraClass : "");
    el.textContent = text;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return el;
  }
  function add(role, text) {
    messages.push({ role: role, text: text, t: Date.now() });
    save();
    bubble(role, text);
  }

  // ---------- Memories ----------
  function paintMemCount() { memCount.textContent = String(memories.length); }

  function renderMemories() {
    memList.textContent = "";
    if (!memories.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing yet. As we talk, I’ll remember the important things.";
      memList.appendChild(li);
      return;
    }
    memories.slice().reverse().forEach(function (m) {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = m.text;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.setAttribute("aria-label", "Delete this memory");
      del.textContent = "×";
      del.addEventListener("click", function () {
        memories = memories.filter(function (x) { return x.id !== m.id; });
        saveMemories();
        paintMemCount();
        renderMemories();
      });
      li.appendChild(span);
      li.appendChild(del);
      memList.appendChild(li);
    });
  }

  function openMemories() { renderMemories(); memPanel.hidden = false; memClose.focus(); }
  function closeMemories() { memPanel.hidden = true; }
  memBtn.addEventListener("click", openMemories);
  memClose.addEventListener("click", closeMemories);

  memForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = memInput.value.trim().slice(0, 200);
    if (!text) return;
    memInput.value = "";
    memories.push({ id: uid(), text: text, t: Date.now() });
    if (memories.length > MAX_MEMORIES) memories = memories.slice(-MAX_MEMORIES);
    saveMemories();
    paintMemCount();
    renderMemories();
  });

  memClear.addEventListener("click", function () {
    if (!memories.length) return;
    if (!window.confirm("Delete everything I remember about you?")) return;
    memories = [];
    saveMemories();
    paintMemCount();
    renderMemories();
  });

  // Asks the AI what is worth remembering from the latest messages.
  async function extractMemories() {
    if (extracting) return;
    extracting = true;
    const snapshot = memories.slice();
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mode: "extract",
          messages: messages.slice(-6).map(function (m) { return { role: m.role, text: m.text }; }),
          memories: snapshot.map(function (m) { return m.text; })
        })
      });
      const data = await res.json();
      if (!res.ok) return;

      const removeIds = (data.remove || []).map(function (n) {
        const item = snapshot[n - 1];
        return item ? item.id : null;
      });
      memories = memories.filter(function (m) { return removeIds.indexOf(m.id) === -1; });

      const have = memories.map(function (m) { return m.text.toLowerCase(); });
      let added = 0;
      (data.add || []).forEach(function (t) {
        if (typeof t !== "string") return;
        const clean = t.trim().slice(0, 200);
        if (!clean || have.indexOf(clean.toLowerCase()) !== -1) return;
        memories.push({ id: uid(), text: clean, t: Date.now() });
        have.push(clean.toLowerCase());
        added++;
      });
      if (memories.length > MAX_MEMORIES) memories = memories.slice(-MAX_MEMORIES);
      saveMemories();
      paintMemCount();
      if (!memPanel.hidden) renderMemories();
      if (added) setStatus("Remembered something new", 2500);
    } catch (e) {
      /* memory is a bonus: ignore errors */
    } finally {
      extracting = false;
    }
  }

  // ---------- Her voice ----------
  const SPEAKER_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paintMute() { muteBtn.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON; }

  async function loadVoices() {
    voiceIdx = [];
    if (!TTS) return;
    try {
      const r = await TTS.getSupportedVoices();
      const all = (r && r.voices) || [];
      const base = SPEECH_LANG.split("-")[0].toLowerCase();
      all.forEach(function (v, i) {
        if (v && v.lang && v.lang.toLowerCase().indexOf(base) === 0) voiceIdx.push(i);
      });
    } catch (e) { voiceIdx = []; }
  }

  // ---------- Animated avatar ----------
  const LOOKS = [
    { name: "Sunset", skin: "#f6d3bd", hair: "#3b2233", outfit: "#f08aa6", bgA: "#4a3a7e", bgB: "#1b2340" },
    { name: "Ocean",  skin: "#ebc4a4", hair: "#1f2b49", outfit: "#5b8def", bgA: "#2f5a8a", bgB: "#18223f" },
    { name: "Forest", skin: "#cf9f7e", hair: "#2a1a13", outfit: "#4fb48a", bgA: "#2f6b5c", bgB: "#16263a" },
    { name: "Berry",  skin: "#f3d6c6", hair: "#6c2c52", outfit: "#a35be8", bgA: "#6a3a8e", bgB: "#1d1f45" },
    { name: "Golden", skin: "#b9825c", hair: "#16110f", outfit: "#f0b44a", bgA: "#8a6a2f", bgB: "#241f33" }
  ];

  const Face2D = (function () {
    const ids = ["figure", "eyeL", "eyeR", "pupilL", "pupilR", "browL", "browR", "mouth", "cheekL", "cheekR",
      "skin", "neck", "hairBack", "hairFront", "outfit", "bgA", "bgB"];
    const el = {};
    ids.forEach(function (id) { el[id] = document.getElementById(id); });
    const stage = document.getElementById("stage");
    const faceSvg = document.getElementById("face");
    const lookBtn = document.getElementById("lookBtn");
    const hideBtn = document.getElementById("stageHide");
    const calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    let state = "idle";
    let talking = false, talkStart = 0, visemes = [], visTotal = 1, visIdx = 0;
    let lastElapsed = 0;
    const cur = { open: 0, smile: 0.4, browL: 0, browR: 0, tilt: 0, gx: 0, gy: 0, bob: 0 };
    let nextBlink = 1400, blinkStart = -1;
    let nextGlance = 2500, glanceX = 0, glanceY = 0;
    let smileBoost = 0;
    let raf = 0, lastTs = 0;
    let lookIdx = 0;

    function buildVisemes(text) {
      const out = [];
      const s = String(text).replace(/\s+/g, " ").slice(0, 700);
      let total = 0;
      for (let i = 0; i < s.length; i++) {
        const c = s[i].toLowerCase();
        let o = 0.3, ms = 62;
        if (c === "a") o = 0.95;
        else if (c === "o") o = 0.8;
        else if (c === "e") o = 0.6;
        else if (c === "u") o = 0.6;
        else if (c === "i") o = 0.45;
        else if (c === "b" || c === "m" || c === "p") o = 0.04;
        else if (c === " ") { o = 0.12; ms = 40; }
        else if (c === "." || c === "!" || c === "?") { o = 0; ms = 280; }
        else if (c === "," || c === ";" || c === ":") { o = 0; ms = 140; }
        else if (/[0-9]/.test(c)) o = 0.45;
        else if (c.charCodeAt(0) > 127) { o = 0.25 + (c.charCodeAt(0) % 5) * 0.1; ms = 70; }
        total += ms;
        out.push({ o: o, end: total });
      }
      visTotal = Math.max(total, 1);
      return out;
    }

    function mouthPath(open, smile) {
      const cx = 100, cy = 128;
      const w = 13 + smile * 3 + open * 1.5;
      const cornerY = cy - smile * 4 + open * 1;
      const upperY = cy - 2 - smile - open * 3;
      const lowerY = cy + 3 + open * 17 + Math.max(smile, 0) * 4;
      return "M" + (cx - w).toFixed(1) + " " + cornerY.toFixed(1) +
        " Q" + cx + " " + upperY.toFixed(1) + " " + (cx + w).toFixed(1) + " " + cornerY.toFixed(1) +
        " Q" + cx + " " + lowerY.toFixed(1) + " " + (cx - w).toFixed(1) + " " + cornerY.toFixed(1) + " Z";
    }

    function applyLook() {
      const L = LOOKS[lookIdx % LOOKS.length];
      el.skin.setAttribute("fill", L.skin);
      el.neck.setAttribute("fill", L.skin);
      el.hairBack.setAttribute("fill", L.hair);
      el.hairFront.setAttribute("fill", L.hair);
      el.outfit.setAttribute("fill", L.outfit);
      el.browL.setAttribute("stroke", L.hair);
      el.browR.setAttribute("stroke", L.hair);
      el.bgA.setAttribute("stop-color", L.bgA);
      el.bgB.setAttribute("stop-color", L.bgB);
    }

    function nextLook() {
      lookIdx = (lookIdx + 1) % LOOKS.length;
      lsSet("companion_look", String(lookIdx));
      applyLook();
      smileBoost = 1;
      blinkStart = performance.now();
      setStatus("Look: " + LOOKS[lookIdx].name, 1500);
    }

    function targets(t) {
      // returns the pose this state is aiming for
      const g = { smile: 0.45, browL: 0, browR: 0, tilt: 0, gx: glanceX, gy: glanceY };
      if (state === "listening") {
        g.smile = 0.25; g.browL = -4; g.browR = -4; g.tilt = calm ? 0 : -5; g.gx = 0; g.gy = 0;
      } else if (state === "thinking") {
        g.smile = -0.05; g.browL = -5; g.browR = -1; g.gx = 4; g.gy = -4; g.tilt = calm ? 0 : 3;
      } else if (state === "speaking") {
        g.smile = 0.35; g.browL = -1; g.browR = -1; g.gx = 0; g.gy = 0;
        g.tilt = calm ? 0 : Math.sin(t * 3.1) * 1.6;
      } else {
        g.tilt = calm ? 0 : Math.sin(t * 0.7) * 1.2;
      }
      g.smile += smileBoost * 0.5;
      return g;
    }

    function frame(ts) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min((ts - (lastTs || ts)) / 1000, 0.1);
      lastTs = ts;
      const t = ts / 1000;
      const kFast = 1 - Math.exp(-dt * 24);
      const kSoft = 1 - Math.exp(-dt * 8);

      // glances while idle
      if (ts > nextGlance) {
        nextGlance = ts + 2000 + Math.random() * 3000;
        glanceX = state === "idle" ? (Math.random() * 6 - 3) : 0;
        glanceY = state === "idle" ? (Math.random() * 3 - 1.5) : 0;
      }
      // blinking
      if (blinkStart < 0 && ts > nextBlink) { blinkStart = ts; nextBlink = ts + 2200 + Math.random() * 3300; }
      let eyeScale = 1;
      if (blinkStart >= 0) {
        const p = (ts - blinkStart) / 150;
        if (p >= 1) blinkStart = -1; else eyeScale = 1 - 0.92 * Math.sin(Math.PI * p);
      }

      // mouth opening from the words being spoken
      let openT = 0;
      if (talking && visemes.length) {
        const elapsed = (performance.now() - talkStart) % (visTotal + 300);
        if (elapsed < lastElapsed) visIdx = 0;
        lastElapsed = elapsed;
        while (visIdx < visemes.length - 1 && visemes[visIdx].end < elapsed) visIdx++;
        openT = elapsed > visTotal ? 0 : visemes[visIdx].o;
      }
      cur.open += (openT - cur.open) * kFast;

      const g = targets(t);
      smileBoost *= Math.exp(-dt * 1.6);
      cur.smile += (g.smile - cur.smile) * kSoft;
      cur.browL += (g.browL - cur.browL) * kSoft;
      cur.browR += (g.browR - cur.browR) * kSoft;
      cur.tilt += (g.tilt - cur.tilt) * kSoft;
      cur.gx += (g.gx - cur.gx) * kSoft;
      cur.gy += (g.gy - cur.gy) * kSoft;
      const bobT = calm ? 0 : Math.sin(t * 1.5) * 1.2 + (talking ? cur.open * 1.2 : 0);
      cur.bob += (bobT - cur.bob) * kSoft;

      el.mouth.setAttribute("d", mouthPath(cur.open, cur.smile));
      el.figure.setAttribute("transform", "translate(0 " + cur.bob.toFixed(2) + ") rotate(" + cur.tilt.toFixed(2) + " 100 150)");
      el.eyeL.style.transform = "scaleY(" + eyeScale.toFixed(3) + ")";
      el.eyeR.style.transform = "scaleY(" + eyeScale.toFixed(3) + ")";
      el.pupilL.setAttribute("transform", "translate(" + cur.gx.toFixed(2) + " " + cur.gy.toFixed(2) + ")");
      el.pupilR.setAttribute("transform", "translate(" + cur.gx.toFixed(2) + " " + cur.gy.toFixed(2) + ")");
      el.browL.setAttribute("transform", "translate(0 " + cur.browL.toFixed(2) + ")");
      el.browR.setAttribute("transform", "translate(0 " + cur.browR.toFixed(2) + ")");
      const blush = 0.28 + Math.max(cur.smile, 0) * 0.25;
      el.cheekL.setAttribute("opacity", blush.toFixed(2));
      el.cheekR.setAttribute("opacity", blush.toFixed(2));
    }

    function start() { if (!raf) { lastTs = 0; raf = requestAnimationFrame(frame); } }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    function showStage(on) {
      stage.hidden = !on;
      document.body.classList.toggle("stage-on", on);
      lsSet("companion_stage", on ? "1" : "0");
      Face.applyRun();
    }

    return {
      init: function () {
        el.eyeL.style.transformBox = "fill-box"; el.eyeL.style.transformOrigin = "center";
        el.eyeR.style.transformBox = "fill-box"; el.eyeR.style.transformOrigin = "center";
        lookIdx = parseInt(lsGet("companion_look") || "0", 10) || 0;
        applyLook();
        showStage(lsGet("companion_stage") !== "0");
        faceSvg.addEventListener("click", nextLook);
        lookBtn.addEventListener("click", nextLook);
        hideBtn.addEventListener("click", function () { showStage(false); });
        avatar.addEventListener("click", function () { showStage(true); });
      },
      run: function (on) { if (on) start(); else stop(); },
      show: function (on) { showStage(on); },
      setState: function (s) { state = s; if (s !== "speaking") talking = false; },
      speak: function (text) { visemes = buildVisemes(text); visIdx = 0; lastElapsed = 0; talkStart = performance.now(); talking = true; state = "speaking"; },
      stopTalking: function () { talking = false; if (state === "speaking") state = "idle"; },
      endListening: function () { if (state === "listening") state = "idle"; },
      endThinking: function () { if (state === "thinking") state = "idle"; }
    };
  })();

  // ---------- 3D avatar (VRM model) ----------
  const AVATAR_URL = "avatar.vrm";
  // How she looks in each mood (0 to 1). Change these numbers to taste.
  const EXPR_BASE = {
    idle:      { relaxed: 0.25 },
    listening: { surprised: 0.12, Surprised: 0.12 },
    thinking:  { sad: 0.10 },
    speaking:  { relaxed: 0.20 }
  };
  const EXPR_ALL = ["aa", "ih", "ou", "ee", "oh", "blink", "relaxed", "happy", "sad", "surprised", "Surprised"];
  const VOWEL_KEYS = ["aa", "ee", "ih", "oh", "ou"];

  const Face3D = (function () {
    const host = document.getElementById("stage3d");
    const calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    let ready = false, loading = null;
    let THREE = null, renderer = null, scene = null, camera = null, vrm = null, lookTarget = null;
    let headBone = null, neckBone = null, chestBone = null;
    let headY = 1.45;
    let framing = "bust", bodyTop = 1.66, bodyBottom = 0, hipsBone = null, curPR = 0;
    let state = "idle";
    let talking = false, talkStart = 0, visemes = [], visTotal = 1, visIdx = 0, lastElapsed = 0;
    const cur = {};
    EXPR_ALL.forEach(function (n) { cur[n] = 0; });
    const pose = { tilt: 0, nod: 0, turn: 0, gx: 0, gy: 0 };
    let nextBlink = 1500, blinkStart = -1;
    let nextGlance = 2500, glanceX = 0, glanceY = 0;
    let raf = 0, last = 0;
    let api = null;

    function buildVisemes(text) {
      const out = [];
      const s = String(text).replace(/\s+/g, " ").slice(0, 700);
      let total = 0;
      for (let i = 0; i < s.length; i++) {
        const c = s[i].toLowerCase();
        let k = "aa", o = 0.28, ms = 64;
        if (c === "a") { k = "aa"; o = 0.85; }
        else if (c === "e") { k = "ee"; o = 0.70; }
        else if (c === "i") { k = "ih"; o = 0.70; }
        else if (c === "o") { k = "oh"; o = 0.80; }
        else if (c === "u") { k = "ou"; o = 0.75; }
        else if (c === "b" || c === "m" || c === "p") { k = null; o = 0; }
        else if (c === " ") { k = null; o = 0; ms = 40; }
        else if (c === "." || c === "!" || c === "?") { k = null; o = 0; ms = 280; }
        else if (c === "," || c === ";" || c === ":") { k = null; o = 0; ms = 140; }
        else if (/[0-9]/.test(c)) { k = "oh"; o = 0.4; }
        else if (c.charCodeAt(0) > 127) { k = VOWEL_KEYS[c.charCodeAt(0) % 5]; o = 0.6; ms = 70; }
        total += ms;
        out.push({ k: k, o: o, end: total });
      }
      visTotal = Math.max(total, 1);
      return out;
    }

    function bone(name) { return vrm && vrm.humanoid ? vrm.humanoid.getNormalizedBoneNode(name) : null; }

    function poseArms() {
      const lU = bone("leftUpperArm"), rU = bone("rightUpperArm"), lH = bone("leftHand");
      if (!lU || !rU) return;
      const a = 1.2;
      lU.rotation.z = -a;
      rU.rotation.z = a;
      vrm.scene.updateMatrixWorld(true);
      if (lH) {
        const hp = new THREE.Vector3(), sp = new THREE.Vector3();
        lH.getWorldPosition(hp);
        lU.getWorldPosition(sp);
        // if the hand ended up higher than the shoulder, the arms went the wrong way: flip them
        if (hp.y > sp.y - 0.05) { lU.rotation.z = a; rU.rotation.z = -a; }
      }
    }

    function setExpr(name, v) {
      const em = vrm && vrm.expressionManager;
      if (em) em.setValue(name, v);
    }

    function frame(ts) {
      raf = requestAnimationFrame(frame);
      if (ts - last < 32) return; // about 30 frames per second
      const dt = Math.min((ts - (last || ts)) / 1000, 0.1);
      last = ts;
      const t = ts / 1000;
      const kFast = 1 - Math.exp(-dt * 22);
      const kSoft = 1 - Math.exp(-dt * 7);

      // vowel shapes for the words being spoken
      const tv = {};
      if (talking && visemes.length) {
        const elapsed = (performance.now() - talkStart) % (visTotal + 300);
        if (elapsed < lastElapsed) visIdx = 0;
        lastElapsed = elapsed;
        while (visIdx < visemes.length - 1 && visemes[visIdx].end < elapsed) visIdx++;
        const v = visemes[visIdx];
        if (elapsed <= visTotal && v && v.k) tv[v.k] = v.o;
      }

      // blinking
      if (blinkStart < 0 && ts > nextBlink) { blinkStart = ts; nextBlink = ts + 2200 + Math.random() * 3300; }
      let blink = 0;
      if (blinkStart >= 0) {
        const p = (ts - blinkStart) / 170;
        if (p >= 1) blinkStart = -1; else blink = Math.sin(Math.PI * p);
      }

      // expressions
      const base = EXPR_BASE[state] || EXPR_BASE.idle;
      EXPR_ALL.forEach(function (n) {
        let target = 0;
        if (n === "blink") { cur.blink = blink; setExpr("blink", blink); return; }
        if (VOWEL_KEYS.indexOf(n) >= 0) target = tv[n] || 0;
        else target = base[n] || 0;
        const k = VOWEL_KEYS.indexOf(n) >= 0 ? kFast : kSoft;
        cur[n] += (target - cur[n]) * k;
        setExpr(n, cur[n]);
      });

      // head and body movement
      let tilt = 0, nod = 0, turn = 0, gx = 0, gy = 0;
      if (state === "listening") { tilt = -0.07; nod = -0.02; }
      else if (state === "thinking") { nod = -0.09; turn = 0.16; tilt = 0.04; gx = -0.3; gy = 0.25; }
      else if (state === "speaking") { nod = Math.sin(t * 3.0) * 0.025 + cur.aa * 0.03; tilt = Math.sin(t * 1.7) * 0.02; }
      else {
        tilt = Math.sin(t * 0.7) * 0.03; nod = Math.sin(t * 0.5) * 0.015;
        if (ts > nextGlance) { nextGlance = ts + 2000 + Math.random() * 3000; glanceX = Math.random() * 0.3 - 0.15; glanceY = Math.random() * 0.1 - 0.05; }
        gx = glanceX; gy = glanceY;
      }
      if (calm) { tilt *= 0.3; nod *= 0.3; }
      pose.tilt += (tilt - pose.tilt) * kSoft;
      pose.nod += (nod - pose.nod) * kSoft;
      pose.turn += (turn - pose.turn) * kSoft;
      pose.gx += (gx - pose.gx) * kSoft;
      pose.gy += (gy - pose.gy) * kSoft;
      if (headBone) headBone.rotation.set(pose.nod, pose.turn, pose.tilt);
      if (neckBone) neckBone.rotation.set(pose.nod * 0.4, pose.turn * 0.4, pose.tilt * 0.4);
      if (chestBone && !calm) chestBone.rotation.set(Math.sin(t * 1.5) * 0.012, 0, 0);
      if (hipsBone && !calm) hipsBone.rotation.set(0, Math.sin(t * 0.45) * 0.025, 0);
      if (lookTarget) lookTarget.position.set(pose.gx, headY + pose.gy, camera.position.z);

      vrm.update(dt);
      renderer.render(scene, camera);
    }

    function applyFraming() {
      if (!camera) return;
      const pr = Math.min(window.devicePixelRatio || 1, framing === "full" ? 1.5 : 2);
      if (renderer && pr !== curPR) { curPR = pr; renderer.setPixelRatio(pr); }
      const tanH = Math.tan((camera.fov * Math.PI / 180) / 2);
      let cy, d;
      if (framing === "full") {
        const h = (bodyTop - bodyBottom) * 1.14;
        cy = (bodyTop + bodyBottom) / 2 + 0.02;
        d = Math.max(h / (2 * tanH), 0.85 / (2 * tanH * camera.aspect));
      } else {
        cy = headY + 0.03;
        d = 1.0;
      }
      camera.position.set(0, cy, d);
      camera.lookAt(0, cy, 0);
      camera.updateProjectionMatrix();
    }

    function resize() {
      if (!renderer || !camera) return;
      const w = host.clientWidth || 300, h = host.clientHeight || 200;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      applyFraming();
    }

    async function doLoad() {
      THREE = await import("three");
      const loaderMod = await import("three/addons/loaders/GLTFLoader.js");
      const vrmMod = await import("@pixiv/three-vrm");

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      host.appendChild(renderer.domElement);
      renderer.domElement.addEventListener("webglcontextlost", function (e) {
        e.preventDefault();
        if (api && api.onLost) api.onLost();
      });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
      const key = new THREE.DirectionalLight(0xffffff, Math.PI);
      key.position.set(0.6, 1.0, 1.2);
      scene.add(key);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      lookTarget = new THREE.Object3D();
      scene.add(lookTarget);

      const loader = new loaderMod.GLTFLoader();
      loader.register(function (parser) { return new vrmMod.VRMLoaderPlugin(parser); });
      const gltf = await new Promise(function (resolve, reject) {
        loader.load(AVATAR_URL, resolve, function (pr) {
          if (pr && pr.total) setStatus("Loading Aura… " + Math.round(100 * pr.loaded / pr.total) + "%");
        }, reject);
      });
      vrm = gltf.userData && gltf.userData.vrm;
      if (!vrm) throw new Error("avatar.vrm is not a VRM file");
      const U = vrmMod.VRMUtils;
      if (U && U.rotateVRM0) U.rotateVRM0(vrm);
      if (U && U.combineSkeletons) { try { U.combineSkeletons(vrm.scene); } catch (e) { /* optional */ } }
      vrm.scene.traverse(function (o) { o.frustumCulled = false; });
      scene.add(vrm.scene);

      headBone = bone("head");
      neckBone = bone("neck");
      chestBone = bone("chest") || bone("spine");
      poseArms();
      vrm.scene.updateMatrixWorld(true);
      if (headBone) {
        const hp = new THREE.Vector3();
        headBone.getWorldPosition(hp);
        headY = hp.y;
      }
      hipsBone = bone("hips");
      try {
        const box = new THREE.Box3().setFromObject(vrm.scene);
        if (isFinite(box.max.y) && isFinite(box.min.y) && box.max.y - box.min.y > 0.5 && box.max.y - box.min.y < 3) {
          bodyTop = box.max.y; bodyBottom = box.min.y;
        }
      } catch (e) { /* keep the default height */ }
      if (vrm.lookAt) vrm.lookAt.target = lookTarget;

      resize();
      if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
      ready = true;
    }

    api = {
      onLost: null,
      isReady: function () { return ready; },
      setFraming: function (k) { framing = k; if (ready) resize(); },
      load: function () {
        if (ready) return Promise.resolve();
        if (!loading) loading = doLoad().catch(function (e) { loading = null; throw e; });
        return loading;
      },
      run: function (on) {
        if (on && ready && !raf) { last = 0; raf = requestAnimationFrame(frame); }
        else if (!on && raf) { cancelAnimationFrame(raf); raf = 0; }
      },
      setState: function (s) { state = s; if (s !== "speaking") talking = false; },
      speak: function (text) { visemes = buildVisemes(text); visIdx = 0; lastElapsed = 0; talkStart = performance.now(); talking = true; state = "speaking"; },
      stopTalking: function () { talking = false; if (state === "speaking") state = "idle"; },
      endListening: function () { if (state === "listening") state = "idle"; },
      endThinking: function () { if (state === "thinking") state = "idle"; }
    };
    return api;
  })();

  // ---------- Avatar views: Full screen 3D, 3D at the top, or the 2D face ----------
  const Face = (function () {
    const stageEl = document.getElementById("stage");
    const faceSvg = document.getElementById("face");
    const stage3d = document.getElementById("stage3d");
    const lookBtn = document.getElementById("lookBtn");
    const viewBtn = document.getElementById("viewBtn");
    const credit = document.getElementById("credit");
    const VIEWS = ["full", "top", "2d"];
    const LABEL = { full: "Full", top: "Top", "2d": "2D" };
    let view = "2d";
    let maxH = 0, lastW = 0;

    // keep the full-screen avatar the same size when the keyboard opens
    function lockStageHeight() {
      const w = window.innerWidth, h = window.innerHeight;
      if (w !== lastW) { maxH = 0; lastW = w; }
      maxH = Math.max(maxH, h);
      document.documentElement.style.setProperty("--fullH", maxH + "px");
    }

    function applyRun() {
      const vis = !stageEl.hidden && !document.hidden;
      Face2D.run(vis && view === "2d");
      Face3D.run(vis && view !== "2d");
    }

    function paint() {
      const is3 = view !== "2d", full = view === "full";
      faceSvg.style.display = is3 ? "none" : "";
      stage3d.hidden = !is3;
      credit.hidden = !is3;
      lookBtn.style.display = is3 ? "none" : "";
      viewBtn.textContent = LABEL[view];
      document.body.classList.toggle("mode-3d", is3);
      document.body.classList.toggle("view-full", full);
      if (full) Face2D.show(true);
      Face3D.setFraming(full ? "full" : "bust");
    }

    async function setView(v, remember) {
      if (v !== "2d") {
        try {
          setStatus("Loading Aura…");
          await Face3D.load();
          setStatus("Online");
        } catch (e) {
          console.error(e);
          setStatus("3D not available: " + (e && e.message ? e.message : String(e)), 7000);
          v = "2d";
        }
      }
      view = v;
      if (remember) lsSet("companion_view", v);
      paint();
      applyRun();
    }

    return {
      applyRun: applyRun,
      init: function () {
        lockStageHeight();
        window.addEventListener("resize", lockStageHeight);
        Face2D.init();
        Face3D.onLost = function () { setStatus("3D stopped, using the 2D face", 5000); setView("2d", false); };
        viewBtn.addEventListener("click", function () { setView(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length], true); });
        document.addEventListener("visibilitychange", applyRun);
        const old = lsGet("companion_avatar");
        const pref = lsGet("companion_view") || (old === "2d" ? "2d" : "full");
        setView(VIEWS.indexOf(pref) >= 0 ? pref : "full", false);
      },
      setState: function (s) { Face2D.setState(s); Face3D.setState(s); },
      speak: function (t) { Face2D.speak(t); Face3D.speak(t); },
      stopTalking: function () { Face2D.stopTalking(); Face3D.stopTalking(); },
      endListening: function () { Face2D.endListening(); Face3D.endListening(); },
      endThinking: function () { Face2D.endThinking(); Face3D.endThinking(); }
    };
  })();

  async function stopSpeaking() {
    try {
      if (TTS) await TTS.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (e) {}
    avatar.classList.remove("speaking");
    Face.stopTalking();
  }

  async function say(text, force) {
    if (muted && !force) return;
    avatar.classList.add("speaking");
    Face.speak(text);
    try {
      if (TTS) {
        const opts = { text: text, lang: SPEECH_LANG, rate: 1.0, pitch: 1.1, volume: 1.0 };
        if (voiceIdx.length) opts.voice = voiceIdx[voicePos % voiceIdx.length];
        await TTS.speak(opts);
      } else if (window.speechSynthesis) {
        await new Promise(function (resolve) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = SPEECH_LANG; u.pitch = 1.1;
          u.onend = resolve; u.onerror = resolve;
          window.speechSynthesis.speak(u);
        });
      }
    } catch (e) {
      /* speech failed: ignore, the text is still on screen */
    } finally {
      avatar.classList.remove("speaking");
      Face.stopTalking();
    }
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    lsSet("companion_muted", muted ? "1" : "0");
    paintMute();
    if (muted) stopSpeaking();
    setStatus(muted ? "Voice off" : "Voice on", 1500);
  });

  voiceBtn.addEventListener("click", async function () {
    if (!voiceIdx.length) await loadVoices();
    if (!voiceIdx.length) { setStatus("No voices found", 2000); return; }
    await stopSpeaking();
    voicePos = (voicePos + 1) % voiceIdx.length;
    lsSet("companion_voice", String(voicePos));
    setStatus("Voice " + (voicePos + 1) + " of " + voiceIdx.length, 2500);
    say("Hi, this is my voice. Do you like it?", true);
  });

  // ---------- Your voice (microphone) ----------
  async function toggleMic() {
    if (!SR) { setStatus("Mic works in the installed app", 2500); return; }
    if (listening) { try { await SR.stop(); } catch (e) {} return; }
    await stopSpeaking();
    try {
      const av = await SR.available();
      if (!av || !av.available) { setStatus("Speech recognition not available", 3000); return; }
      let perm = await SR.checkPermissions();
      if (perm.speechRecognition !== "granted") perm = await SR.requestPermissions();
      if (perm.speechRecognition !== "granted") { setStatus("Microphone permission needed", 3000); return; }
      listening = true;
      micBtn.classList.add("on");
      Face.setState("listening");
      setStatus("Listening…");
      const r = await SR.start({ language: SPEECH_LANG, maxResults: 1, partialResults: false, popup: false });
      const text = r && r.matches && r.matches[0];
      listening = false;
      micBtn.classList.remove("on");
      if (text && text.trim()) { setStatus("Online"); handleSend(text.trim()); }
      else setStatus("Didn’t catch that", 2000);
    } catch (e) {
      setStatus("Didn’t catch that", 2000);
    } finally {
      listening = false;
      micBtn.classList.remove("on");
      Face.endListening();
    }
  }
  micBtn.addEventListener("click", toggleMic);

  // ---------- AI ----------
  async function getReply(history) {
    const recent = history.slice(-20).map(function (m) { return { role: m.role, text: m.text }; });
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: recent,
        memories: memories.map(function (m) { return m.text; })
      })
    });
    const data = await res.json();
    if (!res.ok || !data.reply) throw new Error(data.error || "No reply");
    return data.reply;
  }

  async function handleSend(text) {
    await stopSpeaking();
    add("me", text);
    sendBtn.disabled = true;
    avatar.classList.add("thinking");
    Face.setState("thinking");
    setStatus("Typing…");
    const typing = bubble("ai", "…", "typing");
    let reply = null;
    try {
      reply = await getReply(messages);
      typing.remove();
      add("ai", reply);
    } catch (e) {
      typing.remove();
      bubble("ai", "I couldn’t reach the AI. Check your connection and try again.");
    } finally {
      avatar.classList.remove("thinking");
      Face.endThinking();
      setStatus("Online");
      sendBtn.disabled = false;
    }
    if (reply) {
      say(reply);
      if (text.length >= 15) extractMemories();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    handleSend(text);
  });

  load();
  paintMute();
  paintMemCount();
  loadVoices();
  Face.init();
  if (messages.length === 0) {
    messages.push({ role: "ai", text: GREETING, t: Date.now() });
    save();
  }
  messages.forEach(function (m) { bubble(m.role, m.text); });
</script>
</body>
</html>
