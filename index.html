<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2340" />
<title>Companion</title>
<style>
  :root {
    --ink: #1b2340;
    --panel: #232c52;
    --bubble-ai: #2e386b;
    --bubble-me: #f08aa6;
    --text: #f1eef8;
    --text-me: #2a1020;
    --muted: #9aa3cf;
    --glow: #8fa2ff;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
  }
  #avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd3e0, #f08aa6 45%, #7b5cff 100%);
    box-shadow: 0 0 0 0 rgba(143, 162, 255, .5);
    flex: none;
  }
  #avatar.thinking { animation: breathe 1.6s ease-in-out infinite; }
  #avatar.speaking { animation: talk .7s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(143, 162, 255, .45); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(143, 162, 255, 0); }
  }
  @keyframes talk {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(240, 138, 166, .5); }
    50% { transform: scale(1.14); box-shadow: 0 0 0 12px rgba(240, 138, 166, 0); }
  }
  .title { flex: 1; min-width: 0; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  #status { font-size: 13px; color: var(--muted); }

  .hbtn {
    border: 0;
    background: var(--ink);
    color: var(--text);
    border-radius: 18px;
    height: 36px;
    min-width: 36px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--text-me); border-bottom-right-radius: 6px; }
  .msg.typing { color: var(--muted); }

  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    align-items: center;
  }
  #mic {
    flex: none;
    width: 44px; height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #mic.on { background: var(--bubble-me); color: var(--text-me); animation: talk .9s ease-in-out infinite; }
  #input {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 22px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--text);
    font: inherit;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus-visible, #send:focus-visible, #mic:focus-visible, .hbtn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  #send {
    border: 0;
    border-radius: 22px;
    height: 44px;
    padding: 0 20px;
    background: var(--bubble-me);
    color: var(--text-me);
    font: inherit;
    font-weight: 600;
  }
  #send:disabled { opacity: .5; }
  @media (prefers-reduced-motion: reduce) {
    #avatar.thinking, #avatar.speaking, #mic.on { animation: none; }
    main { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <header>
    <div id="avatar" aria-hidden="true"></div>
    <div class="title">
      <h1 id="name"></h1>
      <div id="status">Online</div>
    </div>
    <button id="voiceBtn" class="hbtn" type="button" aria-label="Change voice">Voice</button>
    <button id="muteBtn" class="hbtn" type="button" aria-label="Mute or unmute her voice"></button>
  </header>

  <main id="list" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <button id="mic" type="button" aria-label="Speak">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="input" type="text" placeholder="Message" aria-label="Message" enterkeyhint="send" />
    <button id="send" type="submit">Send</button>
  </form>

<script type="module">
  import { Capacitor, registerPlugin } from "@capacitor/core";

  // ---------- Settings: change these ----------
  const COMPANION_NAME = "Companion";
  const GREETING = "Hi, I’m here. What’s on your mind?";
  const STORAGE_KEY = "companion_chat_v1";
  const WORKER_URL = "https://companion-api.anokhasoy8.workers.dev";
  const SPEECH_LANG = "en-IN";   // try "hi-IN" for Hindi, "en-US" for US English
  // --------------------------------------------

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const micBtn = document.getElementById("mic");
  const muteBtn = document.getElementById("muteBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const avatar = document.getElementById("avatar");
  const statusEl = document.getElementById("status");
  document.getElementById("name").textContent = COMPANION_NAME;
  window.addEventListener("error", function (ev) { statusEl.textContent = "Error: " + (ev.message || "unknown"); });

  // Native plugins (only exist inside the installed Android app)
  let SR = null;
  let TTS = null;
  try {
    if (Capacitor.isNativePlatform()) {
      SR = registerPlugin("SpeechRecognition");
      TTS = registerPlugin("TextToSpeech");
    }
  } catch (e) { SR = null; TTS = null; }

  let messages = [];
  let muted = false;
  let voicePos = 0;
  let voiceIdx = [];
  let listening = false;
  let statusTimer = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function setStatus(text, resetAfterMs) {
    statusEl.textContent = text;
    clearTimeout(statusTimer);
    if (resetAfterMs) statusTimer = setTimeout(function () { statusEl.textContent = "Online"; }, resetAfterMs);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      messages = raw ? JSON.parse(raw) : [];
    } catch (e) { messages = []; }
    muted = lsGet("companion_muted") === "1";
    voicePos = parseInt(lsGet("companion_voice") || "0", 10) || 0;
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-200))); } catch (e) {}
  }

  function bubble(role, text, extraClass) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extraClass ? " " + extraClass : "");
    el.textContent = text;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return el;
  }
  function add(role, text) {
    messages.push({ role: role, text: text, t: Date.now() });
    save();
    bubble(role, text);
  }

  // ---------- Her voice ----------
  const SPEAKER_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paintMute() { muteBtn.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON; }

  async function loadVoices() {
    voiceIdx = [];
    if (!TTS) return;
    try {
      const r = await TTS.getSupportedVoices();
      const all = (r && r.voices) || [];
      const base = SPEECH_LANG.split("-")[0].toLowerCase();
      all.forEach(function (v, i) {
        if (v && v.lang && v.lang.toLowerCase().indexOf(base) === 0) voiceIdx.push(i);
      });
    } catch (e) { voiceIdx = []; }
  }

  async function stopSpeaking() {
    try {
      if (TTS) await TTS.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (e) {}
    avatar.classList.remove("speaking");
  }

  async function say(text, force) {
    if (muted && !force) return;
    avatar.classList.add("speaking");
    try {
      if (TTS) {
        const opts = { text: text, lang: SPEECH_LANG, rate: 1.0, pitch: 1.1, volume: 1.0 };
        if (voiceIdx.length) opts.voice = voiceIdx[voicePos % voiceIdx.length];
        await TTS.speak(opts);
      } else if (window.speechSynthesis) {
        await new Promise(function (resolve) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = SPEECH_LANG; u.pitch = 1.1;
          u.onend = resolve; u.onerror = resolve;
          window.speechSynthesis.speak(u);
        });
      }
    } catch (e) {
      /* speech failed: ignore, the text is still on screen */
    } finally {
      avatar.classList.remove("speaking");
    }
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    lsSet("companion_muted", muted ? "1" : "0");
    paintMute();
    if (muted) stopSpeaking();
    setStatus(muted ? "Voice off" : "Voice on", 1500);
  });

  voiceBtn.addEventListener("click", async function () {
    if (!voiceIdx.length) await loadVoices();
    if (!voiceIdx.length) { setStatus("No voices found", 2000); return; }
    await stopSpeaking();
    voicePos = (voicePos + 1) % voiceIdx.length;
    lsSet("companion_voice", String(voicePos));
    setStatus("Voice " + (voicePos + 1) + " of " + voiceIdx.length, 2500);
    say("Hi, this is my voice. Do you like it?", true);
  });

  // ---------- Your voice (microphone) ----------
  async function toggleMic() {
    if (!SR) { setStatus("Mic works in the installed app", 2500); return; }
    if (listening) { try { await SR.stop(); } catch (e) {} return; }
    await stopSpeaking();
    try {
      const av = await SR.available();
      if (!av || !av.available) { setStatus("Speech recognition not available", 3000); return; }
      let perm = await SR.checkPermissions();
      if (perm.speechRecognition !== "granted") perm = await SR.requestPermissions();
      if (perm.speechRecognition !== "granted") { setStatus("Microphone permission needed", 3000); return; }
      listening = true;
      micBtn.classList.add("on");
      setStatus("Listening…");
      const r = await SR.start({ language: SPEECH_LANG, maxResults: 1, partialResults: false, popup: false });
      const text = r && r.matches && r.matches[0];
      listening = false;
      micBtn.classList.remove("on");
      if (text && text.trim()) { setStatus("Online"); handleSend(text.trim()); }
      else setStatus("Didn’t catch that", 2000);
    } catch (e) {
      setStatus("Didn’t catch that", 2000);
    } finally {
      listening = false;
      micBtn.classList.remove("on");
    }
  }
  micBtn.addEventListener("click", toggleMic);

  // ---------- AI ----------
  async function getReply(history) {
    const recent = history.slice(-20).map(function (m) { return { role: m.role, text: m.text }; });
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: recent })
    });
    const data = await res.json();
    if (!res.ok || !data.reply) throw new Error(data.error || "No reply");
    return data.reply;
  }

  async function handleSend(text) {
    await stopSpeaking();
    add("me", text);
    sendBtn.disabled = true;
    avatar.classList.add("thinking");
    setStatus("Typing…");
    const typing = bubble("ai", "…", "typing");
    let reply = null;
    try {
      reply = await getReply(messages);
      typing.remove();
      add("ai", reply);
    } catch (e) {
      typing.remove();
      bubble("ai", "I couldn’t reach the AI. Check your connection and try again.");
    } finally {
      avatar.classList.remove("thinking");
      setStatus("Online");
      sendBtn.disabled = false;
    }
    if (reply) say(reply);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    handleSend(text);
  });

  load();
  paintMute();
  loadVoices();
  if (messages.length === 0) {
    messages.push({ role: "ai", text: GREETING, t: Date.now() });
    save();
  }
  messages.forEach(function (m) { bubble(m.role, m.text); });
</script>
</body>
</html>
