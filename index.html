<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2340" />
<title>Companion</title>
<style>
  :root {
    --ink: #0e1327;
    --panel: #212a4f;
    --bubble-ai: #313a66;
    --bubble-me: #7b4f8f;
    --text: #eef0ff;
    --text-me: #ffffff;
    --muted: #9aa3cf;
    --glow: #b08be8;
    --accent: #a77bd8;
    --ok: #4ade80;
    --think: #ffc857;
    --listen: #b794ff;
    --speak: #6ea8ff;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) 14px env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }

  /* ----- top bar ----- */
  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px 0; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--accent); min-width: 0; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .04em; color: var(--text); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    max-width: 62vw; padding: 7px 13px; border-radius: 999px;
    background: rgba(74, 222, 128, .13); color: var(--ok);
    font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    transition: background .25s, color .25s;
  }
  .pill #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex: none; }
  body[data-state="listening"] .pill { background: rgba(183, 148, 255, .16); color: var(--listen); }
  body[data-state="thinking"] .pill { background: rgba(255, 200, 87, .14); color: var(--think); }
  body[data-state="speaking"] .pill { background: rgba(110, 168, 255, .16); color: var(--speak); }
  body[data-state="error"] .pill { background: rgba(255, 120, 120, .15); color: #ff8f8f; }
  .wave { display: none; align-items: center; gap: 2px; height: 12px; }
  body[data-state="listening"] .wave, body[data-state="speaking"] .wave { display: inline-flex; }
  .wave i { width: 3px; height: 100%; background: currentColor; border-radius: 2px; transform: scaleY(.3); animation: bar .9s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s; }
  .wave i:nth-child(3) { animation-delay: .3s; }
  .wave i:nth-child(4) { animation-delay: .45s; }
  @keyframes bar { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  /* ----- avatar card ----- */
  #stage {
    position: relative; flex: none; overflow: hidden;
    height: clamp(230px, 40vh, 360px);
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, .07);
    background: radial-gradient(circle at 50% 30%, #3a3f7a 0%, #1a2048 55%, #11162f 100%);
    display: flex; align-items: center; justify-content: center;
    transition: height .25s ease;
  }
  #stageMsg {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 20px;
    text-align: center; color: var(--muted); font-size: 14px; line-height: 1.4; white-space: pre-line;
  }
  #stageMsg[hidden] { display: none; }
  #retryBtn { background: rgba(167, 123, 216, .28); color: var(--text); height: 38px; padding: 0 18px; }
  #retryBtn[hidden] { display: none; }
  #stage3d { position: absolute; inset: 0; }
  #stage3d[hidden] { display: none; }
  #stage3d canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .rings { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 2; }
  body[data-state="listening"] .rings { opacity: 1; box-shadow: inset 0 0 0 2px rgba(183, 148, 255, .6), inset 0 0 46px rgba(183, 148, 255, .38); animation: ringPulse 1.5s ease-in-out infinite; }
  body[data-state="thinking"] .rings { opacity: 1; box-shadow: inset 0 0 0 1px rgba(255, 200, 87, .4), inset 0 0 30px rgba(255, 200, 87, .16); }
  body[data-state="speaking"] .rings { opacity: 1; box-shadow: inset 0 0 0 1px rgba(110, 168, 255, .45), inset 0 0 34px rgba(110, 168, 255, .24); }
  @keyframes ringPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  #credit { position: absolute; left: 12px; bottom: 8px; z-index: 3; font-size: 10px; opacity: .6; color: var(--text); pointer-events: none; }
  #credit[hidden] { display: none; }
  .tools { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; gap: 8px; }
  .hbtn {
    border: 0; background: rgba(14, 19, 39, .58); color: var(--text);
    border-radius: 18px; height: 36px; min-width: 36px; padding: 0 11px;
    font: inherit; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.kbd-open #stage, body.chat-expanded #stage { height: clamp(120px, 20vh, 170px); }

  /* ----- intro ----- */
  #intro { flex: none; text-align: center; padding: 0 0 2px; }
  #intro h2 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  #intro p { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); }
  body.has-chat #intro, body.kbd-open #intro, body.chat-expanded #intro { display: none; }

  /* ----- conversation card ----- */
  #chatCard { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 26px; padding: 14px 12px 12px; margin-bottom: 12px; }
  .chathead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; }
  .chathead h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .link { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 8px; border-radius: 12px; }
  main#list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 10px; scroll-behavior: smooth; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 18px; font-size: 15.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--text-me); border-bottom-right-radius: 6px; }
  .msg.typing { color: var(--muted); animation: blinkText 1.2s ease-in-out infinite; }
  @keyframes blinkText { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  form.bar { display: flex; gap: 8px; align-items: center; }
  #form { flex: none; padding-top: 4px; }
  #input, #memInput {
    flex: 1; min-width: 0; border: 0; border-radius: 24px; padding: 13px 17px;
    background: var(--ink); color: var(--text); font: inherit; font-size: 15.5px;
  }
  #input::placeholder, #memInput::placeholder { color: var(--muted); }
  #mic, #send {
    flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--accent);
    -webkit-tap-highlight-color: transparent;
  }
  #send { background: var(--accent); color: #fff; }
  #send:disabled { opacity: .45; }
  #mic.on { background: rgba(183, 148, 255, .22); color: #fff; animation: micPulse 1.2s ease-out infinite; }
  @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(183, 148, 255, .6); } 100% { box-shadow: 0 0 0 14px rgba(183, 148, 255, 0); } }
  #memAdd { border: 0; border-radius: 22px; height: 44px; padding: 0 20px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  #input:focus-visible, #memInput:focus-visible, #send:focus-visible, #memAdd:focus-visible, #mic:focus-visible,
  .hbtn:focus-visible, .del:focus-visible, #memClear:focus-visible, .link:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

  /* Memories panel */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel[hidden] { display: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--panel);
  }
  .panel-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  #memList {
    list-style: none;
    margin: 0;
    padding: 12px 16px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #memList li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--bubble-ai);
    border-radius: 14px;
    padding: 10px 6px 10px 14px;
  }
  #memList li span { flex: 1; overflow-wrap: anywhere; }
  #memList li.empty { background: transparent; color: var(--muted); padding: 8px 0; }
  .del {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex: none;
  }
  #memClear {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 12px;
  }


  .panel .hbtn { background: var(--ink); }

  /* ----- full-screen view: the avatar fills the screen and the chat floats over her ----- */
  body.view-full { padding-left: 0; padding-right: 0; gap: 0; }
  body.view-full #stage {
    position: fixed; top: 0; left: 0; right: 0; height: var(--fullH, 100%);
    border-radius: 0; border: 0; z-index: 0;
    background: radial-gradient(circle at 50% 36%, #3b4285 0%, #232a56 48%, #131833 100%);
  }
  body.view-full #topbar { position: relative; z-index: 2; padding: 10px 14px 0; }
  body.view-full .tools { top: calc(env(safe-area-inset-top, 0px) + 60px); }
  body.view-full #credit { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 66px); }
  body.view-full #intro, body.view-full .chathead { display: none; }
  body.view-full #chatCard { position: relative; z-index: 2; flex: 0 1 auto; margin: auto 0 0; background: transparent; padding: 0 12px 8px; border-radius: 0; }
  body.view-full main#list {
    flex: none; max-height: min(44vh, 360px); padding-top: 28px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
  }
  body.view-full .msg.ai { background: rgba(49, 58, 102, .7); }
  body.view-full .msg.me { background: rgba(123, 79, 143, .82); }
  body.view-full #input { background: rgba(60, 70, 128, .72); }
  body.view-full #form { background: rgba(14, 19, 39, .35); border-radius: 30px; padding: 6px; }

  @media (prefers-reduced-motion: reduce) {
    #mic.on, .rings, .wave i, .msg.typing { animation: none; }
    main#list { scroll-behavior: auto; }
    #stage { transition: none; }
  }
</style>
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg>
      <h1 id="name"></h1>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="status">Online</span><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
  </header>

  <section id="stage">
    <div id="stage3d" hidden></div>
    <div id="stageMsg" hidden><p id="stageMsgText"></p><button id="retryBtn" class="hbtn" type="button" hidden>Retry</button></div>
    <div class="rings" aria-hidden="true"></div>
    <div id="credit" hidden>Avatar “Aura” by Mrhunt394 YT</div>
    <div class="tools">
      <button id="viewBtn" class="hbtn" type="button" aria-label="Change the avatar view">Card</button>
      <button id="voiceBtn" class="hbtn" type="button" aria-label="Change voice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></svg></button>
      <button id="memBtn" class="hbtn" type="button" aria-label="Open memories"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span id="memCount">0</span></button>
      <button id="muteBtn" class="hbtn" type="button" aria-label="Mute or unmute her voice"></button>
    </div>
  </section>
  <div id="avatar" hidden></div>

  <section id="intro"><h2 id="introName"></h2><p>Your personal AI companion</p></section>

  <section id="chatCard">
    <div class="chathead"><h2>Conversation</h2><button id="expandBtn" class="link" type="button">Expand</button></div>
    <main id="list" aria-live="polite"></main>
    <form id="form" class="bar" autocomplete="off">
      <input id="input" type="text" placeholder="Message AURA…" aria-label="Message" enterkeyhint="send" />
      <button id="mic" type="button" aria-label="Speak"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg></button>
    </form>
  </section>

  <section id="memPanel" class="panel" role="dialog" aria-modal="true" aria-label="Memories" hidden>
    <div class="panel-head">
      <h2>What I remember</h2>
      <button id="memClose" class="hbtn" type="button">Close</button>
    </div>
    <ul id="memList"></ul>
    <form id="memForm" class="bar" autocomplete="off">
      <input id="memInput" type="text" placeholder="Add something to remember" aria-label="Add a memory" maxlength="200" />
      <button id="memAdd" type="submit">Add</button>
    </form>
    <button id="memClear" type="button">Clear all memories</button>
  </section>

<script type="module">
  import { Capacitor, registerPlugin } from "@capacitor/core";

  // ---------- Settings: change these ----------
  const COMPANION_NAME = "AURA";
  const GREETING = "Hello! How can I help you today?";
  const STORAGE_KEY = "companion_chat_v1";
  const MEMORY_KEY = "companion_memories_v1";
  const MAX_MEMORIES = 100;
  const WORKER_URL = "https://companion-api.anokhasoy8.workers.dev";
  const SPEECH_LANG = "en-IN";   // try "hi-IN" for Hindi, "en-US" for US English
  // --------------------------------------------

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const micBtn = document.getElementById("mic");
  const muteBtn = document.getElementById("muteBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const memBtn = document.getElementById("memBtn");
  const memCount = document.getElementById("memCount");
  const memPanel = document.getElementById("memPanel");
  const memList = document.getElementById("memList");
  const memForm = document.getElementById("memForm");
  const memInput = document.getElementById("memInput");
  const memClose = document.getElementById("memClose");
  const memClear = document.getElementById("memClear");
  const avatar = document.getElementById("avatar");
  const statusEl = document.getElementById("status");
  document.getElementById("name").textContent = COMPANION_NAME;
  document.getElementById("introName").textContent = "I’m " + COMPANION_NAME;
  window.addEventListener("error", function (ev) { statusEl.textContent = "Error: " + (ev.message || "unknown"); });

  // Native plugins (only exist inside the installed Android app)
  let SR = null;
  let TTS = null;
  try {
    if (Capacitor.isNativePlatform()) {
      SR = registerPlugin("SpeechRecognition");
      TTS = registerPlugin("TextToSpeech");
    }
  } catch (e) { SR = null; TTS = null; }

  let messages = [];
  let memories = [];
  let muted = false;
  let voicePos = 0;
  let voiceIdx = [];
  let listening = false;
  let extracting = false;
  let statusTimer = null;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function setStatus(text, resetAfterMs) {
    statusEl.textContent = text;
    clearTimeout(statusTimer);
    if (resetAfterMs) statusTimer = setTimeout(function () { statusEl.textContent = "Online"; }, resetAfterMs);
  }

  function load() {
    try { messages = JSON.parse(lsGet(STORAGE_KEY) || "[]"); } catch (e) { messages = []; }
    try { memories = JSON.parse(lsGet(MEMORY_KEY) || "[]"); } catch (e) { memories = []; }
    if (!Array.isArray(messages)) messages = [];
    if (!Array.isArray(memories)) memories = [];
    muted = lsGet("companion_muted") === "1";
    voicePos = parseInt(lsGet("companion_voice") || "0", 10) || 0;
  }
  function save() { lsSet(STORAGE_KEY, JSON.stringify(messages.slice(-200))); }
  function saveMemories() { lsSet(MEMORY_KEY, JSON.stringify(memories)); }

  function bubble(role, text, extraClass) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extraClass ? " " + extraClass : "");
    el.textContent = text;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return el;
  }
  function paintChatState() { document.body.classList.toggle("has-chat", messages.length > 1); }
  function add(role, text) {
    messages.push({ role: role, text: text, t: Date.now() });
    save();
    bubble(role, text);
    paintChatState();
  }

  // ---------- Memories ----------
  function paintMemCount() { memCount.textContent = String(memories.length); }

  function renderMemories() {
    memList.textContent = "";
    if (!memories.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing yet. As we talk, I’ll remember the important things.";
      memList.appendChild(li);
      return;
    }
    memories.slice().reverse().forEach(function (m) {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = m.text;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.setAttribute("aria-label", "Delete this memory");
      del.textContent = "×";
      del.addEventListener("click", function () {
        memories = memories.filter(function (x) { return x.id !== m.id; });
        saveMemories();
        paintMemCount();
        renderMemories();
      });
      li.appendChild(span);
      li.appendChild(del);
      memList.appendChild(li);
    });
  }

  function openMemories() { renderMemories(); memPanel.hidden = false; memClose.focus(); }
  function closeMemories() { memPanel.hidden = true; }
  memBtn.addEventListener("click", openMemories);
  memClose.addEventListener("click", closeMemories);

  memForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = memInput.value.trim().slice(0, 200);
    if (!text) return;
    memInput.value = "";
    memories.push({ id: uid(), text: text, t: Date.now() });
    if (memories.length > MAX_MEMORIES) memories = memories.slice(-MAX_MEMORIES);
    saveMemories();
    paintMemCount();
    renderMemories();
  });

  memClear.addEventListener("click", function () {
    if (!memories.length) return;
    if (!window.confirm("Delete everything I remember about you?")) return;
    memories = [];
    saveMemories();
    paintMemCount();
    renderMemories();
  });

  // Asks the AI what is worth remembering from the latest messages.
  async function extractMemories() {
    if (extracting) return;
    extracting = true;
    const snapshot = memories.slice();
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mode: "extract",
          messages: messages.slice(-6).map(function (m) { return { role: m.role, text: m.text }; }),
          memories: snapshot.map(function (m) { return m.text; })
        })
      });
      const data = await res.json();
      if (!res.ok) return;

      const removeIds = (data.remove || []).map(function (n) {
        const item = snapshot[n - 1];
        return item ? item.id : null;
      });
      memories = memories.filter(function (m) { return removeIds.indexOf(m.id) === -1; });

      const have = memories.map(function (m) { return m.text.toLowerCase(); });
      let added = 0;
      (data.add || []).forEach(function (t) {
        if (typeof t !== "string") return;
        const clean = t.trim().slice(0, 200);
        if (!clean || have.indexOf(clean.toLowerCase()) !== -1) return;
        memories.push({ id: uid(), text: clean, t: Date.now() });
        have.push(clean.toLowerCase());
        added++;
      });
      if (memories.length > MAX_MEMORIES) memories = memories.slice(-MAX_MEMORIES);
      saveMemories();
      paintMemCount();
      if (!memPanel.hidden) renderMemories();
      if (added) setStatus("Remembered something new", 2500);
    } catch (e) {
      /* memory is a bonus: ignore errors */
    } finally {
      extracting = false;
    }
  }

  // ---------- Her voice ----------
  const SPEAKER_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paintMute() { muteBtn.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON; }

  async function loadVoices() {
    voiceIdx = [];
    if (!TTS) return;
    try {
      const r = await TTS.getSupportedVoices();
      const all = (r && r.voices) || [];
      const base = SPEECH_LANG.split("-")[0].toLowerCase();
      all.forEach(function (v, i) {
        if (v && v.lang && v.lang.toLowerCase().indexOf(base) === 0) voiceIdx.push(i);
      });
    } catch (e) { voiceIdx = []; }
  }

  // ---------- 3D avatar (VRM model) ----------
  const AVATAR_URL = "avatar.vrm";
  // How she looks in each mood (0 to 1). Change these numbers to taste.
  const EXPR_BASE = {
    idle:      { relaxed: 0.25 },
    listening: { surprised: 0.12, Surprised: 0.12 },
    thinking:  { sad: 0.10 },
    speaking:  { relaxed: 0.20 }
  };
  const EXPR_ALL = ["aa", "ih", "ou", "ee", "oh", "blink", "relaxed", "happy", "sad", "surprised", "Surprised"];
  const VOWEL_KEYS = ["aa", "ee", "ih", "oh", "ou"];

  const Face3D = (function () {
    const host = document.getElementById("stage3d");
    const calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    let ready = false, loading = null;
    let THREE = null, renderer = null, scene = null, camera = null, vrm = null, lookTarget = null;
    let headBone = null, neckBone = null, chestBone = null, upperChestBone = null, spineBone = null;
    let lean = 0, mood = "neutral", moodUntil = 0, qualityDrop = 0, perfAcc = 0, perfN = 0;
    let headY = 1.45;
    let framing = "bust", bodyTop = 1.66, bodyBottom = 0, hipsBone = null, curPR = 0;
    let state = "idle";
    let talking = false, talkStart = 0, visemes = [], visTotal = 1, visIdx = 0, lastElapsed = 0;
    const cur = {};
    EXPR_ALL.forEach(function (n) { cur[n] = 0; });
    const pose = { tilt: 0, nod: 0, turn: 0, gx: 0, gy: 0 };
    let nextBlink = 1500, blinkStart = -1;
    let nextGlance = 2500, glanceX = 0, glanceY = 0;
    let raf = 0, last = 0;
    let api = null;

    function buildVisemes(text) {
      const out = [];
      const s = String(text).replace(/\s+/g, " ").slice(0, 700);
      let total = 0;
      for (let i = 0; i < s.length; i++) {
        const c = s[i].toLowerCase();
        let k = "aa", o = 0.28, ms = 64;
        if (c === "a") { k = "aa"; o = 0.85; }
        else if (c === "e") { k = "ee"; o = 0.70; }
        else if (c === "i") { k = "ih"; o = 0.70; }
        else if (c === "o") { k = "oh"; o = 0.80; }
        else if (c === "u") { k = "ou"; o = 0.75; }
        else if (c === "b" || c === "m" || c === "p") { k = null; o = 0; }
        else if (c === " ") { k = null; o = 0; ms = 40; }
        else if (c === "." || c === "!" || c === "?") { k = null; o = 0; ms = 280; }
        else if (c === "," || c === ";" || c === ":") { k = null; o = 0; ms = 140; }
        else if (/[0-9]/.test(c)) { k = "oh"; o = 0.4; }
        else if (c.charCodeAt(0) > 127) { k = VOWEL_KEYS[c.charCodeAt(0) % 5]; o = 0.6; ms = 70; }
        total += ms;
        out.push({ k: k, o: o, end: total });
      }
      visTotal = Math.max(total, 1);
      return out;
    }

    function bone(name) { return vrm && vrm.humanoid ? vrm.humanoid.getNormalizedBoneNode(name) : null; }

    function poseArms() {
      const lU = bone("leftUpperArm"), rU = bone("rightUpperArm"), lH = bone("leftHand");
      if (!lU || !rU) return;
      const a = 1.2;
      lU.rotation.z = -a;
      rU.rotation.z = a;
      vrm.scene.updateMatrixWorld(true);
      if (lH) {
        const hp = new THREE.Vector3(), sp = new THREE.Vector3();
        lH.getWorldPosition(hp);
        lU.getWorldPosition(sp);
        // if the hand ended up higher than the shoulder, the arms went the wrong way: flip them
        if (hp.y > sp.y - 0.05) { lU.rotation.z = a; rU.rotation.z = -a; }
      }
    }

    function poseElbows() {
      const lL = bone("leftLowerArm"), rL = bone("rightLowerArm"), lH = bone("leftHand");
      if (!lL || !rL) return;
      const e = 0.22;
      lL.rotation.y = -e;
      rL.rotation.y = e;
      vrm.scene.updateMatrixWorld(true);
      if (lH) {
        const hp = new THREE.Vector3(), ep = new THREE.Vector3();
        lH.getWorldPosition(hp);
        lL.getWorldPosition(ep);
        // the hand should move slightly forward; if it went backward, flip the bend
        if (hp.z < ep.z - 0.002) { lL.rotation.y = e; rL.rotation.y = -e; }
      }
    }

    function detectMood(text) {
      const t = String(text).toLowerCase();
      if (/(sorry|sad|unfortunately|stormy|bad news|miss you|difficult)/.test(t)) return "sad";
      if (/(!|😊|😄|glad|happy|great|awesome|wonderful|lovely|love|nice|congrat|fun)/.test(t)) return "happy";
      return "neutral";
    }

    function setExpr(name, v) {
      const em = vrm && vrm.expressionManager;
      if (em) em.setValue(name, v);
    }

    function frame(ts) {
      raf = requestAnimationFrame(frame);
      if (ts - last < 32) return; // about 30 frames per second
      const dt = Math.min((ts - (last || ts)) / 1000, 0.1);
      last = ts;
      const t = ts / 1000;
      const kFast = 1 - Math.exp(-dt * 22);
      const kSoft = 1 - Math.exp(-dt * 7);
      // if the phone struggles, quietly lower the picture sharpness
      perfAcc += dt; perfN++;
      if (perfN >= 90) {
        if (perfAcc / perfN > 0.05 && qualityDrop < 0.75) { qualityDrop += 0.25; applyFraming(); }
        perfAcc = 0; perfN = 0;
      }

      // vowel shapes for the words being spoken
      const tv = {};
      if (talking && visemes.length) {
        const elapsed = (performance.now() - talkStart) % (visTotal + 300);
        if (elapsed < lastElapsed) visIdx = 0;
        lastElapsed = elapsed;
        while (visIdx < visemes.length - 1 && visemes[visIdx].end < elapsed) visIdx++;
        const v = visemes[visIdx];
        if (elapsed <= visTotal && v && v.k) tv[v.k] = v.o;
      }

      // blinking
      if (blinkStart < 0 && ts > nextBlink) { blinkStart = ts; nextBlink = ts + 2200 + Math.random() * 3300; }
      let blink = 0;
      if (blinkStart >= 0) {
        const p = (ts - blinkStart) / 170;
        if (p >= 1) { blinkStart = -1; if (Math.random() < 0.18) nextBlink = ts + 230; } else blink = Math.sin(Math.PI * p);
      }

      // expressions
      const base = Object.assign({}, EXPR_BASE[state] || EXPR_BASE.idle);
      if (ts < moodUntil || state === "speaking") {
        if (mood === "happy") { base.happy = 0.3; base.relaxed = 0.15; }
        else if (mood === "sad") { base.sad = 0.3; base.relaxed = 0; }
      }
      EXPR_ALL.forEach(function (n) {
        let target = 0;
        if (n === "blink") { cur.blink = blink; setExpr("blink", blink); return; }
        if (VOWEL_KEYS.indexOf(n) >= 0) target = tv[n] || 0;
        else target = base[n] || 0;
        const k = VOWEL_KEYS.indexOf(n) >= 0 ? kFast : kSoft;
        cur[n] += (target - cur[n]) * k;
        setExpr(n, cur[n]);
      });

      // head and body movement
      let tilt = 0, nod = 0, turn = 0, gx = 0, gy = 0;
      if (state === "listening") { tilt = -0.07; nod = -0.02; }
      else if (state === "thinking") { nod = -0.09; turn = 0.16; tilt = 0.04; gx = -0.3; gy = 0.25; }
      else if (state === "speaking") { nod = Math.sin(t * 3.0) * 0.025 + cur.aa * 0.03; tilt = Math.sin(t * 1.7) * 0.02; }
      else {
        tilt = Math.sin(t * 0.7) * 0.03; nod = Math.sin(t * 0.5) * 0.015; turn = Math.sin(t * 0.23) * 0.06;
        if (ts > nextGlance) { nextGlance = ts + 2000 + Math.random() * 3000; glanceX = Math.random() * 0.3 - 0.15; glanceY = Math.random() * 0.1 - 0.05; }
        gx = glanceX; gy = glanceY;
      }
      if (calm) { tilt *= 0.3; nod *= 0.3; }
      pose.tilt += (tilt - pose.tilt) * kSoft;
      pose.nod += (nod - pose.nod) * kSoft;
      pose.turn += (turn - pose.turn) * kSoft;
      pose.gx += (gx - pose.gx) * kSoft;
      pose.gy += (gy - pose.gy) * kSoft;
      if (headBone) headBone.rotation.set(pose.nod, pose.turn, pose.tilt);
      if (neckBone) neckBone.rotation.set(pose.nod * 0.4, pose.turn * 0.4, pose.tilt * 0.4);
      lean += ((state === "listening" ? 0.04 : 0) - lean) * kSoft;
      if (!calm) {
        const bre = Math.sin(t * 1.5);
        if (chestBone) chestBone.rotation.set(bre * 0.014 + lean, 0, 0);
        if (upperChestBone) upperChestBone.rotation.set(bre * 0.01, 0, 0);
        if (spineBone) spineBone.rotation.set(0, 0, -Math.sin(t * 0.3) * 0.012);
        if (hipsBone) hipsBone.rotation.set(0, Math.sin(t * 0.45) * 0.025, Math.sin(t * 0.3) * 0.02);
      }
      if (lookTarget) lookTarget.position.set(pose.gx, headY + pose.gy, camera.position.z);

      vrm.update(dt);
      renderer.render(scene, camera);
    }

    function applyFraming() {
      if (!camera) return;
      const pr = Math.max(1, Math.min(window.devicePixelRatio || 1, framing === "full" ? 1.5 : 2) - qualityDrop);
      if (renderer && pr !== curPR) { curPR = pr; renderer.setPixelRatio(pr); }
      const tanH = Math.tan((camera.fov * Math.PI / 180) / 2);
      let cy, d;
      if (framing === "full") {
        const h = (bodyTop - bodyBottom) * 1.14;
        cy = (bodyTop + bodyBottom) / 2 + 0.02;
        d = Math.max(h / (2 * tanH), 0.85 / (2 * tanH * camera.aspect));
      } else if (framing === "half") {
        cy = headY - 0.23;
        d = Math.max(1.05 / (2 * tanH), 0.75 / (2 * tanH * camera.aspect));
      } else {
        cy = headY + 0.03;
        d = 1.0;
      }
      camera.position.set(0, cy, d);
      camera.lookAt(0, cy, 0);
      camera.updateProjectionMatrix();
    }

    function resize() {
      if (!renderer || !camera) return;
      const w = host.clientWidth || 300, h = host.clientHeight || 200;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      applyFraming();
    }

    async function doLoad() {
      THREE = await import("three");
      const loaderMod = await import("three/addons/loaders/GLTFLoader.js");
      const vrmMod = await import("@pixiv/three-vrm");

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      host.appendChild(renderer.domElement);
      renderer.domElement.addEventListener("webglcontextlost", function (e) {
        e.preventDefault();
        if (api && api.onLost) api.onLost();
      });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
      const key = new THREE.DirectionalLight(0xffffff, Math.PI);
      key.position.set(0.6, 1.0, 1.2);
      scene.add(key);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      lookTarget = new THREE.Object3D();
      scene.add(lookTarget);

      const loader = new loaderMod.GLTFLoader();
      loader.register(function (parser) { return new vrmMod.VRMLoaderPlugin(parser); });
      const gltf = await new Promise(function (resolve, reject) {
        loader.load(AVATAR_URL, resolve, function (pr) {
          if (pr && pr.total) setStatus("Loading Aura… " + Math.round(100 * pr.loaded / pr.total) + "%");
        }, reject);
      });
      vrm = gltf.userData && gltf.userData.vrm;
      if (!vrm) throw new Error("avatar.vrm is not a VRM file");
      const U = vrmMod.VRMUtils;
      if (U && U.rotateVRM0) U.rotateVRM0(vrm);
      if (U && U.combineSkeletons) { try { U.combineSkeletons(vrm.scene); } catch (e) { /* optional */ } }
      vrm.scene.traverse(function (o) { o.frustumCulled = false; });
      scene.add(vrm.scene);

      headBone = bone("head");
      neckBone = bone("neck");
      chestBone = bone("chest") || bone("spine");
      upperChestBone = bone("upperChest");
      spineBone = bone("spine");
      poseArms();
      poseElbows();
      vrm.scene.updateMatrixWorld(true);
      if (headBone) {
        const hp = new THREE.Vector3();
        headBone.getWorldPosition(hp);
        headY = hp.y;
      }
      hipsBone = bone("hips");
      try {
        const box = new THREE.Box3().setFromObject(vrm.scene);
        if (isFinite(box.max.y) && isFinite(box.min.y) && box.max.y - box.min.y > 0.5 && box.max.y - box.min.y < 3) {
          bodyTop = box.max.y; bodyBottom = box.min.y;
        }
      } catch (e) { /* keep the default height */ }
      if (vrm.lookAt) vrm.lookAt.target = lookTarget;

      resize();
      if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
      ready = true;
    }

    api = {
      onLost: null,
      isReady: function () { return ready; },
      setFraming: function (k) { framing = k; if (ready) resize(); },
      load: function () {
        if (ready) return Promise.resolve();
        if (!loading) loading = doLoad().catch(function (e) { loading = null; throw e; });
        return loading;
      },
      run: function (on) {
        if (on && ready && !raf) { last = 0; raf = requestAnimationFrame(frame); }
        else if (!on && raf) { cancelAnimationFrame(raf); raf = 0; }
      },
      setState: function (s) { state = s; if (s !== "speaking") talking = false; },
      speak: function (text) { visemes = buildVisemes(text); visIdx = 0; lastElapsed = 0; talkStart = performance.now(); talking = true; state = "speaking"; mood = detectMood(text); },
      stopTalking: function () { talking = false; if (state === "speaking") { state = "idle"; moodUntil = performance.now() + 1500; } },
      endListening: function () { if (state === "listening") state = "idle"; },
      endThinking: function () { if (state === "thinking") state = "idle"; }
    };
    return api;
  })();

  // ---------- Avatar views: Card (default) or Full screen ----------
  const Face = (function () {
    const stage3d = document.getElementById("stage3d");
    const viewBtn = document.getElementById("viewBtn");
    const credit = document.getElementById("credit");
    const expandBtn = document.getElementById("expandBtn");
    const stageMsg = document.getElementById("stageMsg");
    const stageMsgText = document.getElementById("stageMsgText");
    const retryBtn = document.getElementById("retryBtn");
    const VIEWS = ["card", "full"];
    const LABEL = { card: "Card", full: "Full" };
    let view = "card";
    let maxH = 0, lastW = 0;
    let needReload = false;

    function setUi(s) { document.body.dataset.state = s; }

    function showMsg(text, retry) {
      stageMsg.hidden = !text;
      stageMsgText.textContent = text || "";
      retryBtn.hidden = !retry;
    }

    function updateFraming() {
      if (view === "full") Face3D.setFraming("full");
      else {
        const b = document.body.classList;
        Face3D.setFraming(b.contains("kbd-open") || b.contains("chat-expanded") ? "bust" : "half");
      }
    }

    // keep the full-screen avatar the same size when the keyboard opens, and notice the keyboard
    function lockStageHeight() {
      const w = window.innerWidth, h = window.innerHeight;
      if (w !== lastW) { maxH = 0; lastW = w; }
      maxH = Math.max(maxH, h);
      document.documentElement.style.setProperty("--fullH", maxH + "px");
      const kbd = maxH - h > 140;
      if (kbd !== document.body.classList.contains("kbd-open")) {
        document.body.classList.toggle("kbd-open", kbd);
        updateFraming();
      }
    }

    function applyRun() { Face3D.run(!document.hidden); }

    function paint() {
      const ok = Face3D.isReady() && !needReload;
      stage3d.hidden = !ok;
      credit.hidden = !ok;
      viewBtn.textContent = LABEL[view];
      document.body.classList.toggle("mode-3d", ok);
      document.body.classList.toggle("view-full", view === "full");
      document.body.classList.toggle("view-card", view === "card");
      updateFraming();
    }

    async function loadAvatar() {
      if (needReload) { location.reload(); return; }
      showMsg("Loading Aura…", false);
      setStatus("Loading Aura…");
      try {
        await Face3D.load();
        showMsg("", false);
        setStatus("Online");
      } catch (e) {
        console.error(e);
        showMsg("Aura couldn’t load.\n" + (e && e.message ? e.message : String(e)), true);
        setStatus("Avatar not loaded", 6000);
        setUi("error");
        setTimeout(function () { if (document.body.dataset.state === "error") setUi("idle"); }, 6000);
      }
      paint();
      applyRun();
    }

    return {
      applyRun: applyRun,
      updateFraming: updateFraming,
      init: function () {
        setUi("idle");
        lockStageHeight();
        window.addEventListener("resize", lockStageHeight);
        Face3D.onLost = function () { needReload = true; showMsg("The 3D view stopped.", true); paint(); };
        retryBtn.addEventListener("click", loadAvatar);
        viewBtn.addEventListener("click", function () {
          view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length];
          lsSet("companion_view2", view);
          paint();
          applyRun();
        });
        expandBtn.addEventListener("click", function () {
          const on = document.body.classList.toggle("chat-expanded");
          expandBtn.textContent = on ? "Collapse" : "Expand";
          updateFraming();
        });
        document.addEventListener("visibilitychange", applyRun);
        const pref = lsGet("companion_view2");
        view = VIEWS.indexOf(pref) >= 0 ? pref : "card";
        paint();
        loadAvatar();
      },
      setState: function (s) { Face3D.setState(s); setUi(s); },
      speak: function (t) { Face3D.speak(t); setUi("speaking"); },
      stopTalking: function () { Face3D.stopTalking(); if (document.body.dataset.state === "speaking") setUi("idle"); },
      endListening: function () { Face3D.endListening(); if (document.body.dataset.state === "listening") setUi("idle"); },
      endThinking: function () { Face3D.endThinking(); if (document.body.dataset.state === "thinking") setUi("idle"); }
    };
  })();

  async function stopSpeaking() {
    try {
      if (TTS) await TTS.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
    } catch (e) {}
    avatar.classList.remove("speaking");
    Face.stopTalking();
  }

  async function say(text, force) {
    if (muted && !force) return;
    avatar.classList.add("speaking");
    Face.speak(text);
    setStatus("Speaking…");
    try {
      if (TTS) {
        const opts = { text: text, lang: SPEECH_LANG, rate: 1.0, pitch: 1.1, volume: 1.0 };
        if (voiceIdx.length) opts.voice = voiceIdx[voicePos % voiceIdx.length];
        await TTS.speak(opts);
      } else if (window.speechSynthesis) {
        await new Promise(function (resolve) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = SPEECH_LANG; u.pitch = 1.1;
          u.onend = resolve; u.onerror = resolve;
          window.speechSynthesis.speak(u);
        });
      }
    } catch (e) {
      /* speech failed: ignore, the text is still on screen */
    } finally {
      avatar.classList.remove("speaking");
      Face.stopTalking();
      if (statusEl.textContent === "Speaking…") setStatus("Online");
    }
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    lsSet("companion_muted", muted ? "1" : "0");
    paintMute();
    if (muted) stopSpeaking();
    setStatus(muted ? "Voice off" : "Voice on", 1500);
  });

  voiceBtn.addEventListener("click", async function () {
    if (!voiceIdx.length) await loadVoices();
    if (!voiceIdx.length) { setStatus("No voices found", 2000); return; }
    await stopSpeaking();
    voicePos = (voicePos + 1) % voiceIdx.length;
    lsSet("companion_voice", String(voicePos));
    setStatus("Voice " + (voicePos + 1) + " of " + voiceIdx.length, 2500);
    say("Hi, this is my voice. Do you like it?", true);
  });

  // ---------- Your voice (microphone) ----------
  async function toggleMic() {
    if (!SR) { setStatus("Mic works in the installed app", 2500); return; }
    if (listening) { try { await SR.stop(); } catch (e) {} return; }
    await stopSpeaking();
    try {
      const av = await SR.available();
      if (!av || !av.available) { setStatus("Speech recognition not available", 3000); return; }
      let perm = await SR.checkPermissions();
      if (perm.speechRecognition !== "granted") perm = await SR.requestPermissions();
      if (perm.speechRecognition !== "granted") { setStatus("Microphone permission needed", 3000); return; }
      listening = true;
      micBtn.classList.add("on");
      Face.setState("listening");
      setStatus("Listening…");
      const r = await SR.start({ language: SPEECH_LANG, maxResults: 1, partialResults: false, popup: false });
      const text = r && r.matches && r.matches[0];
      listening = false;
      micBtn.classList.remove("on");
      if (text && text.trim()) { setStatus("Online"); handleSend(text.trim()); }
      else setStatus("Didn’t catch that", 2000);
    } catch (e) {
      setStatus("Didn’t catch that", 2000);
    } finally {
      listening = false;
      micBtn.classList.remove("on");
      Face.endListening();
    }
  }
  micBtn.addEventListener("click", toggleMic);

  // ---------- AI ----------
  async function getReply(history) {
    const recent = history.slice(-20).map(function (m) { return { role: m.role, text: m.text }; });
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: recent,
        memories: memories.map(function (m) { return m.text; })
      })
    });
    const data = await res.json();
    if (!res.ok || !data.reply) throw new Error(data.error || "No reply");
    return data.reply;
  }

  async function handleSend(text) {
    await stopSpeaking();
    add("me", text);
    sendBtn.disabled = true;
    avatar.classList.add("thinking");
    Face.setState("thinking");
    setStatus("Typing…");
    const typing = bubble("ai", "…", "typing");
    let reply = null;
    try {
      reply = await getReply(messages);
      typing.remove();
      add("ai", reply);
    } catch (e) {
      typing.remove();
      bubble("ai", "I couldn’t reach the AI. Check your connection and try again.");
    } finally {
      avatar.classList.remove("thinking");
      Face.endThinking();
      setStatus("Online");
      sendBtn.disabled = false;
    }
    if (reply) {
      say(reply);
      if (text.length >= 15) extractMemories();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    handleSend(text);
  });

  load();
  paintMute();
  paintMemCount();
  loadVoices();
  Face.init();
  if (messages.length === 0) {
    messages.push({ role: "ai", text: GREETING, t: Date.now() });
    save();
  }
  messages.forEach(function (m) { bubble(m.role, m.text); });
  paintChatState();
</script>
</body>
</html>
