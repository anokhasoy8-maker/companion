<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2340" />
<title>Companion</title>
<style>
  :root {
    --ink: #1b2340;
    --panel: #232c52;
    --bubble-ai: #2e386b;
    --bubble-me: #f08aa6;
    --text: #f1eef8;
    --text-me: #2a1020;
    --muted: #9aa3cf;
    --glow: #8fa2ff;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
  }
  #avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd3e0, #f08aa6 45%, #7b5cff 100%);
    box-shadow: 0 0 0 0 rgba(143, 162, 255, .5);
    flex: none;
  }
  #avatar.thinking { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(143, 162, 255, .45); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(143, 162, 255, 0); }
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  #status { font-size: 13px; color: var(--muted); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--text-me); border-bottom-right-radius: 6px; }
  .msg.typing { color: var(--muted); }

  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
  }
  #input {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 22px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--text);
    font: inherit;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus-visible, #send:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  #send {
    border: 0;
    border-radius: 22px;
    padding: 0 20px;
    background: var(--bubble-me);
    color: var(--text-me);
    font: inherit;
    font-weight: 600;
  }
  #send:disabled { opacity: .5; }
  @media (prefers-reduced-motion: reduce) {
    #avatar.thinking { animation: none; }
    main { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <header>
    <div id="avatar" aria-hidden="true"></div>
    <div>
      <h1 id="name"></h1>
      <div id="status">Online</div>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Message" aria-label="Message" enterkeyhint="send" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
  // ---------- Settings: change these ----------
  const COMPANION_NAME = "Companion";
  const GREETING = "Hi, I’m here. What’s on your mind?";
  const STORAGE_KEY = "companion_chat_v1";
  const WORKER_URL = "https://companion-api.anokhasoy8.workers.dev";
  // --------------------------------------------

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const avatar = document.getElementById("avatar");
  const statusEl = document.getElementById("status");
  document.getElementById("name").textContent = COMPANION_NAME;

  let messages = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      messages = raw ? JSON.parse(raw) : [];
    } catch (e) { messages = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-200))); } catch (e) {}
  }

  function bubble(role, text, extraClass) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extraClass ? " " + extraClass : "");
    el.textContent = text;
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
    return el;
  }

  function add(role, text) {
    messages.push({ role: role, text: text, t: Date.now() });
    save();
    bubble(role, text);
  }

  // Sends the recent history to your Cloudflare Worker and returns the reply text.
  async function getReply(history) {
    const recent = history.slice(-20).map(function (m) { return { role: m.role, text: m.text }; });
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: recent })
    });
    const data = await res.json();
    if (!res.ok || !data.reply) throw new Error(data.error || "No reply");
    return data.reply;
  }

  async function handleSend(text) {
    add("me", text);
    sendBtn.disabled = true;
    avatar.classList.add("thinking");
    statusEl.textContent = "Typing…";
    const typing = bubble("ai", "…", "typing");
    try {
      const reply = await getReply(messages);
      typing.remove();
      add("ai", reply);
    } catch (e) {
      typing.remove();
      bubble("ai", "I couldn’t reach the AI. Check your connection and try again.");
    } finally {
      avatar.classList.remove("thinking");
      statusEl.textContent = "Online";
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    handleSend(text);
  });

  load();
  if (messages.length === 0) {
    messages.push({ role: "ai", text: GREETING, t: Date.now() });
    save();
  }
  messages.forEach(function (m) { bubble(m.role, m.text); });
</script>
</body>
</html>
